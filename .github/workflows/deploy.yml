# Every push to main builds both images and redeploys the server. Manual runs: Actions → Deploy → Run workflow.
name: Deploy

on:
  push:
    branches: [main]
  pull_request: # build only, so a broken image shows up on the PR before it reaches main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV" # registry names must be lowercase
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}/web:latest,${{ env.IMAGE }}/web:${{ github.sha }}
          build-args: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        with:
          context: services/memory
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}/memory:latest,${{ env.IMAGE }}/memory:${{ github.sha }}
          cache-from: type=gha,scope=memory
          cache-to: type=gha,mode=max,scope=memory

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.DEPLOY_HOST != '' # skipped until the server is set up
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id && chmod 600 ~/.ssh/id
          # shortcut: trusts the host key on first sight; pin it in a DEPLOY_KNOWN_HOSTS secret if you want stricter checks.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Ship and restart
        run: |
          scp -i ~/.ssh/id deploy/docker-compose.yml deploy/Caddyfile ubuntu@"$HOST":/opt/cortex/
          ssh -i ~/.ssh/id ubuntu@"$HOST" "cd /opt/cortex \
            && echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && IMAGE=$IMAGE docker compose pull \
            && IMAGE=$IMAGE docker compose up -d --remove-orphans \
            && docker logout ghcr.io && docker image prune -f"
